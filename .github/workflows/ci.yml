name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Upload application files as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hse-document-finder-app
          path: |
            main.py
            config/
            core/
            models/
            services/
            requirements.txt
            README.md
          retention-days: 30